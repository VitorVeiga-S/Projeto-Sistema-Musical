
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Musical — Sistema Musical</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>🎵</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="page-header-bar">
            <h2>🎼 Biblioteca Musical</h2>
            <div class="header-actions">
                <a href="index.html" class="btn-back">⬅ Voltar ao Menu</a>
                <a href="cadastro_musica.html" class="btn-primary">➕ Nova Música</a>
            </div>
        </div>

        <div class="filters">
            <form method="get" class="filter-form" action="#">
                <div class="filter-group">
                    <div class="filter-item">
                        <label for="busca">Busca geral</label>
                        <input type="text" name="busca" id="busca" placeholder="Título, álbum ou artista…">
                    </div>

                    <div class="filter-item">
                        <label for="artista">Artista</label>
                        <select name="artista" id="artista">
                            <option value="">Todos os artistas</option>
                            <option value="1">Kanye West</option>
                            <option value="2">Brandão</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <label for="genero">Gênero</label>
                        <select name="genero" id="genero">
                            <option value="">Todos os gêneros</option>
                            <option value="RAP">RAP</option>
                        </select>
                    </div>
                </div>

                <div class="filter-actions">
                    <button type="submit" class="btn-primary">🔍 Filtrar</button>
                </div>
            </form>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-capa">Capa</th>
                        <th>Título</th>
                        <th>Artista</th>
                        <th>Álbum</th>
                        <th>Gênero</th>
                        <th class="col-youtube">YouTube</th>
                        <th class="col-acoes">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><div class="no-image">Sem<br>capa</div></td>
                        <td>Flashing Lights</td>
                        <td>Kanye West</td>
                        <td>Graduation</td>
                        <td>Rap</td>
                        <td><a href="#" target="_blank" class="btn-youtube">▶ Assistir</a></td>
                        <td>
                            <div class="action-buttons">
                                <a href="#" class="btn-edit">✏️ Editar</a>
                                <a href="#" class="btn-delete">🗑️ Excluir</a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td><div class="no-image">Sem<br>capa</div></td>
                        <td>100% Molho</td>
                        <td>Brandão</td>
                        <td>ISSO É TRAP</td>
                        <td>Trap</td>
                        <td><a href="#" target="_blank" class="btn-youtube">▶ Assistir</a></td>
                        <td>
                            <div class="action-buttons">
                                <a href="#" class="btn-edit">✏️ Editar</a>
                                <a href="#" class="btn-delete">🗑️ Excluir</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
